<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🚭 흡연예방 퀴즈</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .app-container { width: 100%; max-width: 680px; }
    .header { text-align: center; margin-bottom: 28px; }
    .header .logo { font-size: 3.2rem; }
    .header h1 { font-size: 1.9rem; color: #fff; font-weight: 800; letter-spacing: -0.5px; }
    .header p { color: #94a3b8; margin-top: 6px; font-size: 0.95rem; }
    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      padding: 36px 32px;
      color: #fff;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    #startScreen .tagline { font-size: 1.05rem; color: #cbd5e1; line-height: 1.7; margin-bottom: 28px; text-align: center; }
    .info-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 30px; }
    .info-box { background: rgba(255,255,255,0.08); border-radius: 14px; padding: 16px 10px; text-align: center; }
    .info-box .icon { font-size: 1.8rem; margin-bottom: 6px; }
    .info-box .label { font-size: 0.78rem; color: #94a3b8; }
    .info-box .value { font-size: 1.1rem; font-weight: 700; color: #e2e8f0; margin-top: 2px; }
    .btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: all .2s; }
    .btn-primary { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; box-shadow: 0 6px 20px rgba(231,76,60,0.4); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(231,76,60,0.5); }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.2); margin-top: 12px; }
    .btn-secondary:hover { background: rgba(255,255,255,0.18); }
    #quizScreen { display: none; }
    .progress-bar-wrap { background: rgba(255,255,255,0.1); border-radius: 99px; height: 8px; margin-bottom: 8px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #e74c3c, #f39c12); border-radius: 99px; transition: width .4s ease; }
    .progress-text { display: flex; justify-content: space-between; font-size: 0.82rem; color: #94a3b8; margin-bottom: 24px; }
    .category-badge { display: inline-block; background: rgba(231,76,60,0.25); color: #fc8181; font-size: 0.78rem; font-weight: 700; padding: 4px 12px; border-radius: 99px; margin-bottom: 14px; letter-spacing: 0.5px; }
    .question-text { font-size: 1.18rem; font-weight: 700; line-height: 1.6; color: #f1f5f9; margin-bottom: 26px; }
    .options-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .option-btn { background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 15px 20px; color: #e2e8f0; font-size: 0.97rem; cursor: pointer; text-align: left; transition: all .18s; width: 100%; display: flex; align-items: center; gap: 12px; }
    .option-btn:hover:not(:disabled) { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.3); transform: translateX(4px); }
    .option-btn .opt-num { min-width: 28px; height: 28px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 700; }
    .option-btn.correct { background: rgba(39,174,96,0.25); border-color: #27ae60; color: #6ee7b7; }
    .option-btn.correct .opt-num { background: #27ae60; color: #fff; }
    .option-btn.wrong { background: rgba(231,76,60,0.2); border-color: #e74c3c; color: #fca5a5; }
    .option-btn.wrong .opt-num { background: #e74c3c; color: #fff; }
    .option-btn:disabled { cursor: default; }
    .feedback-box { margin-top: 20px; padding: 16px 20px; border-radius: 14px; font-size: 0.93rem; line-height: 1.6; display: none; }
    .feedback-box.show { display: block; }
    .feedback-box.correct-fb { background: rgba(39,174,96,0.15); border: 1px solid rgba(39,174,96,0.4); color: #6ee7b7; }
    .feedback-box.wrong-fb { background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.4); color: #fca5a5; }
    .feedback-box .fb-exp { color: #cbd5e1; margin-top: 8px; font-size: 0.88rem; }
    .next-btn-wrap { margin-top: 22px; }
    #resultScreen { display: none; text-align: center; }
    .result-emoji { font-size: 4rem; margin-bottom: 14px; }
    .result-grade { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }
    .result-score-big { font-size: 3.5rem; font-weight: 900; background: linear-gradient(135deg, #f6d365, #fda085); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 8px 0; }
    .result-desc { color: #94a3b8; font-size: 0.95rem; margin-bottom: 28px; line-height: 1.6; }
    .stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 28px; }
    .stat-box { background: rgba(255,255,255,0.07); border-radius: 14px; padding: 16px 10px; }
    .stat-box .s-val { font-size: 1.6rem; font-weight: 800; }
    .stat-box .s-label { font-size: 0.78rem; color: #94a3b8; margin-top: 4px; }
    .stat-box.correct-stat .s-val { color: #6ee7b7; }
    .stat-box.wrong-stat .s-val { color: #fca5a5; }
    .stat-box.time-stat .s-val { color: #93c5fd; }
    .review-section { text-align: left; margin-bottom: 28px; }
    .review-section h3 { font-size: 1rem; color: #94a3b8; margin-bottom: 14px; }
    .review-item { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid transparent; }
    .review-item.r-correct { border-left-color: #27ae60; }
    .review-item.r-wrong { border-left-color: #e74c3c; }
    .review-item .r-q { font-size: 0.9rem; color: #e2e8f0; margin-bottom: 6px; font-weight: 600; }
    .review-item .r-a { font-size: 0.83rem; color: #94a3b8; }
    .review-item .r-correct-ans { color: #6ee7b7; }
    .timer-row { display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 0.88rem; margin-bottom: 20px; }
    .timer-circle { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: #fff; position: relative; background: conic-gradient(#e74c3c 0deg, #e74c3c 360deg, rgba(255,255,255,0.1) 360deg); }
    .timer-inner { position: absolute; width: 26px; height: 26px; background: #1a1a2e; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .timer-num { font-size: 0.75rem; font-weight: 800; color: #fff; position: relative; z-index: 1; }
    @media (max-width: 480px) {
      .card { padding: 24px 18px; }
      .question-text { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <div class="logo">🚭</div>
    <h1>흡연예방 퀴즈</h1>
    <p>담배의 위험성과 금연의 중요성을 배워봐요!</p>
  </div>

  <!-- 시작 화면 -->
  <div id="startScreen" class="card">
    <p class="tagline">흡연은 매년 수많은 생명을 앗아갑니다.<br/>이 퀴즈를 통해 담배의 진실을 알아보세요!</p>
    <div class="info-grid">
      <div class="info-box"><div class="icon">❓</div><div class="value">15문제</div><div class="label">총 문항 수</div></div>
      <div class="info-box"><div class="icon">⏱️</div><div class="value">20초</div><div class="label">문항당 시간</div></div>
      <div class="info-box"><div class="icon">🏆</div><div class="value">100점</div><div class="label">만점 기준</div></div>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">🚀 퀴즈 시작하기</button>
  </div>

  <!-- 퀴즈 화면 -->
  <div id="quizScreen" class="card">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-text">
      <span id="progressLabel">1 / 15</span>
      <span id="scoreLabel">점수: 0점</span>
    </div>
    <div class="timer-row">
      <div class="timer-circle" id="timerCircle">
        <div class="timer-inner"><span class="timer-num" id="timerNum">20</span></div>
      </div>
      <span id="timerText">남은 시간: 20초</span>
    </div>
    <span class="category-badge" id="categoryBadge">건강</span>
    <p class="question-text" id="questionText"></p>
    <ul class="options-list" id="optionsList"></ul>
    <div class="feedback-box" id="feedbackBox">
      <span id="fbIcon"></span>
      <strong id="fbTitle"></strong>
      <p class="fb-exp" id="fbExp"></p>
    </div>
    <div class="next-btn-wrap">
      <button class="btn btn-primary" id="nextBtn" style="display:none" onclick="nextQuestion()">다음 문제 →</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="resultScreen" class="card">
    <div class="result-emoji" id="resultEmoji"></div>
    <div class="result-grade" id="resultGrade"></div>
    <div class="result-score-big" id="resultScore"></div>
    <p class="result-desc" id="resultDesc"></p>
    <div class="stats-grid">
      <div class="stat-box correct-stat"><div class="s-val" id="statCorrect">0</div><div class="s-label">✅ 정답</div></div>
      <div class="stat-box wrong-stat"><div class="s-val" id="statWrong">0</div><div class="s-label">❌ 오답</div></div>
      <div class="stat-box time-stat"><div class="s-val" id="statTime">0s</div><div class="s-label">⏱ 소요시간</div></div>
    </div>
    <div class="review-section">
      <h3>📋 문제 복습</h3>
      <div id="reviewList"></div>
    </div>
    <button class="btn btn-primary" onclick="restartQuiz()">🔄 다시 풀기</button>
    <button class="btn btn-secondary" onclick="goHome()">🏠 처음으로</button>
  </div>
</div>

<script>
const QUESTIONS = [
  { category:"성분·화학", q:"담배 연기에 포함된 화학물질의 수는 약 몇 가지일까요?", opts:["약 50가지","약 200가지","약 7,000가지","약 1,000가지"], ans:2, exp:"담배 연기에는 약 7,000가지 이상의 화학물질이 들어 있으며, 그 중 70여 가지는 발암물질입니다." },
  { category:"건강 피해", q:"흡연이 가장 직접적인 원인이 되는 질병은 무엇일까요?", opts:["폐암","당뇨병","골다공증","백내장"], ans:0, exp:"흡연은 폐암의 가장 큰 원인으로, 폐암 사망자의 약 80%가 흡연과 관련됩니다." },
  { category:"니코틴", q:"담배의 중독성 물질인 니코틴이 뇌에 도달하는 시간은?", opts:["약 30분","약 10~20초","약 5분","약 1시간"], ans:1, exp:"니코틴은 흡입 후 약 10~20초 내에 뇌에 도달하여 도파민을 분비시키고 중독을 유발합니다." },
  { category:"간접흡연", q:"간접흡연에 대한 설명 중 옳은 것은?", opts:["직접흡연보다 위험성이 낮다","냄새만 날 뿐 건강에는 무해하다","직접흡연 못지않게 심각한 건강 피해를 줄 수 있다","환기가 잘 되면 전혀 문제없다"], ans:2, exp:"간접흡연도 발암물질이 포함된 담배 연기에 노출되므로 폐암·심장병 등 심각한 위험이 있습니다." },
  { category:"금연 효과", q:"금연 후 20분 이내에 나타나는 신체 변화는?", opts:["폐 기능이 정상으로 회복된다","혈압·맥박이 정상 수준으로 내려간다","암 발생 위험이 절반으로 줄어든다","일산화탄소 농도가 사라진다"], ans:1, exp:"금연 후 20분 만에 혈압과 맥박이 정상화됩니다. 이후 12시간이면 혈중 일산화탄소가 정상화됩니다." },
  { category:"청소년·법률", q:"우리나라 청소년보호법상 담배 구매 가능 연령은?", opts:["만 16세 이상","만 17세 이상","만 18세 이상","만 19세 이상"], ans:3, exp:"대한민국에서는 만 19세 미만(청소년)에게 담배를 판매하는 것은 법으로 금지되어 있습니다." },
  { category:"성분·화학", q:"담배 연기에 포함된 일산화탄소(CO)의 위험성은?", opts:["혈액의 산소 운반 능력을 떨어뜨린다","혈압을 낮춰 졸음을 유발한다","소화 기능만 저하시킨다","일시적으로 시력을 향상시킨다"], ans:0, exp:"일산화탄소는 혈중 헤모글로빈과 결합해 산소 운반을 방해하고 심장·뇌에 산소 부족을 유발합니다." },
  { category:"통계", q:"WHO에 따르면 흡연으로 인해 매년 전 세계에서 사망하는 사람의 수는?", opts:["약 100만 명","약 500만 명","약 800만 명 이상","약 300만 명"], ans:2, exp:"WHO에 따르면 흡연은 매년 약 800만 명 이상의 목숨을 앗아가는 세계 최대의 예방 가능한 사망 원인입니다." },
  { category:"건강 피해", q:"흡연이 심혈관계에 미치는 영향이 아닌 것은?", opts:["혈관을 좁게 만든다","혈전(혈액 응고)을 촉진한다","심장 박동을 규칙적으로 만든다","동맥경화를 유발한다"], ans:2, exp:"흡연은 오히려 심장 박동을 불규칙하게 만들고 부정맥 위험을 높입니다." },
  { category:"금연 방법", q:"금연을 도와주는 니코틴 대체 요법(NRT)에 해당하지 않는 것은?", opts:["니코틴 패치","니코틴 껌","전자담배(액상형)","니코틴 흡입기"], ans:2, exp:"전자담배는 니코틴을 포함하고 유해물질을 배출하기 때문에 공식적인 금연 치료법으로 인정받지 못합니다." },
  { category:"성분·화학", q:"담배에 포함된 타르(Tar)에 대한 설명으로 옳은 것은?", opts:["담배의 향을 좋게 만드는 성분이다","폐에 쌓여 폐암을 유발하는 발암물질 덩어리다","니코틴 흡수를 방해하는 역할을 한다","담배 필터에서 만들어지는 물질이다"], ans:1, exp:"타르는 담배가 연소할 때 생기는 끈끈한 화학물질 혼합물로, 폐 조직에 달라붙어 암을 일으킵니다." },
  { category:"청소년", q:"청소년 흡연이 성인 흡연보다 더 위험한 이유는?", opts:["청소년은 담배를 더 많이 피우기 때문","성장기 뇌·폐 발달에 더 심각한 영향을 미치기 때문","청소년에게만 특수한 독성 물질이 작용하기 때문","담배 회사가 청소년용 담배를 따로 만들기 때문"], ans:1, exp:"청소년기는 뇌와 폐가 발달하는 시기이므로 니코틴 중독이 더 빠르게 진행되고 장기 손상이 심각합니다." },
  { category:"금연 효과", q:"금연 1년 후 심장병 위험은 흡연자에 비해 어떻게 변할까요?", opts:["거의 변화 없음","약 10% 감소","약 절반 수준으로 감소","완전히 정상으로 회복"], ans:2, exp:"금연 1년 후 심장병 발병 위험이 흡연자 대비 약 절반으로 줄어듭니다." },
  { category:"전자담배", q:"전자담배에 대한 설명 중 옳은 것은?", opts:["연소 물질이 없어 완전히 무해하다","일반 담배보다 훨씬 안전하므로 금연 보조제로 권장된다","니코틴과 유해 물질이 포함되어 건강에 해롭다","청소년에게는 판매할 수 있다"], ans:2, exp:"전자담배에도 니코틴·포름알데히드 등 유해물질이 들어 있어 폐 손상, 중독 등을 유발할 수 있습니다." },
  { category:"금연 지원", q:"대한민국에서 무료로 금연 상담과 치료를 받을 수 있는 공공 서비스는?", opts:["금연길라잡이 & 보건소 금연클리닉","건강보험공단 체육 지원 프로그램","국민연금 건강 지원 센터","교육부 흡연 예방 교실"], ans:0, exp:"금연길라잡이(www.nosmokeguide.go.kr)와 전국 보건소 금연클리닉에서 무료로 금연 치료·상담을 받을 수 있습니다." }
];

const TOTAL = QUESTIONS.length;
const TIME_LIMIT = 20;

let currentIndex = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;
let timerInterval = null;
let timeLeft = TIME_LIMIT;
let startTime = 0;
let userAnswers = [];
let questionOrder = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  questionOrder = shuffle([...Array(TOTAL).keys()]);
  currentIndex = 0;
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  userAnswers = [];
  startTime = Date.now();

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';

  loadQuestion();
}

function loadQuestion() {
  answered = false;
  timeLeft = TIME_LIMIT;

  const qi = questionOrder[currentIndex];
  const q = QUESTIONS[qi];

  document.getElementById('progressBar').style.width = `${(currentIndex / TOTAL) * 100}%`;
  document.getElementById('progressLabel').textContent = `${currentIndex + 1} / ${TOTAL}`;
  document.getElementById('scoreLabel').textContent = `점수: ${score}점`;
  document.getElementById('categoryBadge').textContent = q.category;
  document.getElementById('questionText').textContent = q.q;

  const feedbackBox = document.getElementById('feedbackBox');
  feedbackBox.className = 'feedback-box';
  feedbackBox.style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  const nums = ['①','②','③','④'];

  q.opts.forEach((opt, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-num">${nums[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(i));
    li.appendChild(btn);
    list.appendChild(li);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  updateTimerUI(TIME_LIMIT);

  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI(timeLeft);

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) {
        timeUp();
      }
    }
  }, 1000);
}

function updateTimerUI(t) {
  const pct = (t / TIME_LIMIT) * 360;
  const circle = document.getElementById('timerCircle');
  circle.style.background = `conic-gradient(#e74c3c 0deg, #e74c3c ${pct}deg, rgba(255,255,255,0.1) ${pct}deg)`;
  document.getElementById('timerNum').textContent = t;
  document.getElementById('timerText').textContent = `남은 시간: ${t}초`;

  if (t <= 5) {
    circle.style.background = `conic-gradient(#f39c12 0deg, #f39c12 ${pct}deg, rgba(255,255,255,0.1) ${pct}deg)`;
  }
}

function timeUp() {
  answered = true;
  const qi = questionOrder[currentIndex];
  const q = QUESTIONS[qi];

  userAnswers.push({ qi, selected: -1, correct: false });
  wrongCount++;

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
  });

  showFeedback(false, `⏰ 시간 초과! 정답은 "${q.opts[q.ans]}"입니다.`, q.exp);
  document.getElementById('nextBtn').style.display = 'block';
}

function selectAnswer(selected) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const qi = questionOrder[currentIndex];
  const q = QUESTIONS[qi];
  const isCorrect = selected === q.ans;

  if (isCorrect) {
    score += Math.max(10, Math.round((timeLeft / TIME_LIMIT) * 10) * 10 - 10 + 10);
    correctCount++;
  } else {
    wrongCount++;
  }

  userAnswers.push({ qi, selected, correct: isCorrect });

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === selected && !isCorrect) btn.classList.add('wrong');
  });

  if (isCorrect) {
    showFeedback(true, '🎉 정답입니다!', q.exp);
  } else {
    showFeedback(false, `❌ 오답! 정답은 "${q.opts[q.ans]}"입니다.`, q.exp);
  }

  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('scoreLabel').textContent = `점수: ${score}점`;
}
